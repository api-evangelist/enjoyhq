name: EnjoyHQ
description: EnjoyHQ was a centralized user-research and customer-feedback repository — a single
  source of truth where product and UX teams stored, tagged, searched, and analyzed qualitative and
  quantitative research (interviews, surveys, support tickets, NPS scores, and app-store reviews).
  Backed by Point Nine Capital, it was acquired by UserTesting in 2021 and folded into the UserTesting
  Human Insight Platform. Its brand domain getenjoyhq.com now issues a permanent (HTTP 308) redirect to
  usertesting.com/platform/enjoyhq, and EnjoyHQ no longer operates an independent developer,
  documentation, or API surface.
